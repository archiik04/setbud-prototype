<title>SetBud Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: prototype control bar on top, then a three-part app (nav | workspace | SetBud panel). The app wears a deep purple; SetBud carries the orange-to-purple AI gradient. */
:root{
  --bg:#F6F5F4; --surface:#FFFFFF; --sunk:#F1F0EE; --line:#E8E4E2;
  --ink:#1E1A24; --muted:#6B5F73; --app:#4B3387; --app-2:#7E66BE; --app-soft:#EFE9FA; --on-app:#FFFFFF;
  --bud:#BD4E22; --bud-ink:#6A2A10; --bud-soft:#FBEEE7; --bud-line:#F0C9B5;
  --ok:#1D7A46; --ok-soft:#DFF3E7; --warn:#A35A00; --warn-soft:#FDEBD3; --bad:#C0352B; --bad-soft:#FCE4E1;
  --bar:#271F36; --bar-ink:#ECD8F3; --glow:rgba(170,143,228,.22); --shadow:0 1px 2px rgba(39,31,54,.05), 0 6px 20px rgba(39,31,54,.05);
  --grad:linear-gradient(90deg,#BD4E22 0%,#7E66BE 36%,#4B3387 100%);
  --f-ui:"DM Sans", "Segoe UI", system-ui, sans-serif;
  --f-display:"Onest", "DM Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141019; --surface:#1D1726; --sunk:#251E30; --line:#352B44;
  --ink:#F1ECF6; --muted:#B3A6C2; --app:#A993E8; --app-2:#C3B3F0; --app-soft:#2C2242; --on-app:#160F24;
  --bud:#EC8A5E; --bud-ink:#FFD9C7; --bud-soft:#3A2218; --bud-line:#6B3A26;
  --ok:#5BCB8A; --ok-soft:#143524; --warn:#F0A54A; --warn-soft:#3A2810; --bad:#F2877C; --bad-soft:#3D1A17;
  --bar:#0B0810; --bar-ink:#ECD8F3; --glow:rgba(126,102,190,.18); --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141019; --surface:#1D1726; --sunk:#251E30; --line:#352B44;
  --ink:#F1ECF6; --muted:#B3A6C2; --app:#A993E8; --app-2:#C3B3F0; --app-soft:#2C2242; --on-app:#160F24;
  --bud:#EC8A5E; --bud-ink:#FFD9C7; --bud-soft:#3A2218; --bud-line:#6B3A26;
  --ok:#5BCB8A; --ok-soft:#143524; --warn:#F0A54A; --warn-soft:#3A2810; --bad:#F2877C; --bad-soft:#3D1A17;
  --bar:#0B0810; --bar-ink:#ECD8F3; --glow:rgba(126,102,190,.18); --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--bud);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}

/* prototype bar */
.pbar{background:var(--bar);color:var(--bar-ink);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.pbar .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{background:transparent;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--bar-ink)}
.tab[aria-pressed="true"]{background:var(--bud);border-color:var(--bud);color:#1d1300;font-weight:700}
.pbar .spacer{flex:1}
.restart{background:none;border:none;color:var(--bar-ink);text-decoration:underline;font-size:13px;padding:4px}
.note{background:var(--bud-soft);color:var(--bud-ink);border-bottom:1px solid var(--bud-line);padding:8px 16px;font-size:13px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.note b{font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.step{margin-left:auto;font-variant-numeric:tabular-nums;opacity:.8}

/* app shell */
.app{display:grid;grid-template-columns:200px minmax(0,1fr) 380px;min-height:calc(100vh - 90px)}
.app.nobud{grid-template-columns:200px minmax(0,1fr)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.ws{font-weight:800;font-size:15px;padding:4px 8px 2px}
.ws small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.side hr{border:none;border-top:1px solid var(--line);margin:10px 0;width:100%}
.nav{padding:7px 10px;border-radius:8px;color:var(--muted);font-weight:500}
.nav.on{background:var(--app-soft);color:var(--app);font-weight:700}
.main{padding:22px 24px 40px;min-width:0;display:flex;flex-direction:column;gap:16px}
.crumb{color:var(--muted);font-size:13px}
.h1{font-size:22px;font-weight:800}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stat.bad .v{color:var(--bad)} .stat.ok .v{color:var(--ok)}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.mute{background:var(--sunk);color:var(--muted)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--muted);font-weight:600;font-size:12px}
.tablewrap{overflow-x:auto}

/* proactive banner */
.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border:1px solid var(--bud-line);background:var(--bud-soft);border-radius:var(--r);padding:14px 16px}
.banner.red{border-color:var(--bad);background:var(--bad-soft)}
.budmark{width:34px;height:34px;border-radius:10px;background:var(--bud);color:#1d1300;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.banner .txt{flex:1;min-width:220px}
.banner .txt strong{display:block;font-size:15px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600}
.btn.primary{background:var(--app);border-color:var(--app);color:#fff}
.btn.bud{background:var(--bud);border-color:var(--bud);color:#1d1300;font-weight:700}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);text-decoration:underline;padding:8px 6px}

/* SetBud panel */
.bud{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;max-height:calc(100vh - 90px);position:sticky;top:0}
.budhead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.budhead .who{flex:1}
.budhead .who b{display:block}
.budhead .who span{font-size:12px;color:var(--muted)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:none;background:none;padding:4px 10px;font-size:12px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.close{border:none;background:none;font-size:18px;color:var(--muted);padding:2px 6px}
.feed{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:100%;display:flex;flex-direction:column;gap:8px}
.msg.user{align-self:flex-end;background:var(--app);color:#fff;border-radius:12px 12px 2px 12px;padding:8px 12px;max-width:85%}
.msg.bot{background:var(--sunk);border-radius:12px 12px 12px 2px;padding:10px 12px}
.msg.bot p{margin:0}
.evid{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}
.evid::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.issue{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px}
.issue .n{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;grid-row:span 2}
.issue .why{color:var(--muted);font-size:12px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bud-line);background:var(--bud-soft);color:var(--bud-ink);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.opt input{margin-top:3px;accent-color:var(--app)}
.opt small{display:block;color:var(--muted)}
.preview{border:1px dashed var(--bud);border-radius:8px;padding:10px;background:var(--surface)}
.preview ul{margin:6px 0 0;padding-left:18px}
.cost{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-weight:700}
.budfoot{border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center}
.budfoot input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink);font:inherit}
.human{font-size:12px;color:var(--muted);padding:0 14px 10px}
.human button{border:none;background:none;color:var(--app);text-decoration:underline;padding:0;font-size:12px;font-weight:600}
.solved{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.solved span{flex:1;min-width:120px;font-weight:600}
.handcard{border:1px solid var(--app);background:var(--app-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--app);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.before{text-decoration:line-through;color:var(--bad)}
.after{color:var(--ok);font-weight:600}

/* upload */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--surface)}
.file{font-weight:700}
.errline{border-left:4px solid var(--bad);background:var(--bad-soft);padding:10px 12px;border-radius:6px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.errline .t{flex:1;min-width:200px}

/* agent console */
.console{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.sum h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sum ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.sum section{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}
.sum section:last-child{border-bottom:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
.sentok{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:10px 12px;font-weight:600}

@media (max-width: 1100px){
  .app,.app.nobud{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;flex-wrap:wrap;border-right:none;border-bottom:1px solid var(--line);padding:10px 16px}
  .side hr,.ws small{display:none}
  .bud{position:static;max-height:none;border-left:none;border-top:2px solid var(--bud)}
  .console{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 640px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .main{padding:16px}
  .nav{padding:5px 8px;font-size:13px}
}
@media (prefers-reduced-motion: no-preference){
  .msg.bot{animation:rise .25s ease-out both}
  @keyframes rise{from{transform:translateY(4px)}to{transform:none}}
}

/* brand layer */
body{background:radial-gradient(700px 360px at 92% -8%, var(--glow), transparent 70%), radial-gradient(520px 300px at -6% 18%, var(--glow), transparent 70%), var(--bg);background-attachment:fixed}
.h1,.ws,.budhead .who b,.stat .v,.banner .txt strong,.sum h3,.card > b{font-family:var(--f-display);letter-spacing:-.01em}
.h1{font-size:26px;font-weight:600}
.card,.stat,.drop{border-radius:var(--r);box-shadow:var(--shadow)}
.stat .v{font-weight:600}
.btn{border-radius:40px;padding:8px 16px}
.btn.primary{background:var(--app);border-color:var(--app);color:var(--on-app)}
.btn.primary:hover{background:var(--app-2);border-color:var(--app-2)}
.btn.bud{background:var(--grad);border:none;color:#fff;box-shadow:0 4px 14px rgba(126,102,190,.35)}
.msg.user{background:var(--app);color:var(--on-app);border-radius:16px 16px 4px 16px}
.msg.bot{border-radius:16px 16px 16px 4px}
.budmark{background:var(--grad);color:#fff;border-radius:12px;font-family:var(--f-display)}
.banner{border:1.5px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box, var(--grad) border-box;border-radius:var(--r);box-shadow:var(--shadow)}
.banner.red{background:linear-gradient(var(--bad-soft),var(--bad-soft)) padding-box, linear-gradient(90deg,var(--bad),var(--bud)) border-box}
.tab{border-radius:40px;border-color:rgba(236,216,243,.28)}
.tab[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff}
.pbar .tag{color:var(--bar-ink)}
.note{background:var(--app-soft);color:var(--ink);border-bottom:1px solid var(--line)}
.note b{color:var(--app)}
.side{background:color-mix(in srgb, var(--surface) 82%, transparent);backdrop-filter:blur(8px)}
.nav.on{background:var(--app-soft);color:var(--app)}
.bud{border-left:none;box-shadow:-1px 0 0 var(--line)}
.budhead{position:relative}
.budhead::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--grad)}
.chip{border-radius:40px;border-color:var(--line);background:var(--surface);color:var(--app)}
.chip:hover{border-color:var(--app-2)}
.issue,.opt,.solved,.preview{border-radius:12px}
.preview{border-color:var(--app-2)}
.handcard{border-radius:14px;border-color:var(--app-2)}
.avatar{background:var(--app);color:var(--on-app)}
.lang button[aria-pressed="true"]{background:var(--app);color:var(--on-app)}
.opt input{accent-color:var(--app)}
.stack{height:10px}
.budfoot input{border-radius:40px;padding:9px 14px}
@media (max-width: 1100px){.bud{border-top:none;box-shadow:0 -1px 0 var(--line)}}

/* logo */
.budmark{display:grid;place-items:center;background:linear-gradient(135deg,#BD4E22 0%,#7E66BE 58%,#4B3387 100%)}
.budmark svg{display:block}
.budmark.sm{width:28px;height:28px;border-radius:9px}
.brand{display:flex;align-items:center;gap:8px;padding-right:6px;margin-right:2px;border-right:1px solid rgba(236,216,243,.18)}
.wm{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.02em}
.wm span{background:linear-gradient(90deg,#F08A5D,#B9A4F0);-webkit-background-clip:text;background-clip:text;color:transparent}
.budhead .who b.wm{font-size:16px;display:block}
.budhead .who b.wm span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<div class="pbar" role="region" aria-label="Prototype controls">
  <div class="brand"><span class="budmark sm" aria-hidden="true"><svg viewBox="0 0 24 24" width="62%" height="62%" fill="none" aria-hidden="true"><path d="M5 5.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-4 3.2v-3.2H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 15.6v-3.4" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/><path d="M12 12.7c-2.9 0-4.3-1.7-4.3-4 2.7 0 4.3 1.5 4.3 4z" fill="#fff"/><path d="M12 11.5c0-2.5 1.5-4 4.3-4 0 2.5-1.6 4-4.3 4z" fill="#fff"/></svg></span><span class="wm">Set<span>Bud</span></span></div>
  <div class="tabs" id="tabs"></div>
  <span class="spacer"></span>
  <button class="restart" data-act="restart">Restart scenario</button>
</div>
<div class="note" id="note" aria-live="polite"></div>
<div class="app" id="app">
  <nav class="side" id="side" aria-label="App navigation"></nav>
  <main class="main" id="main"></main>
  <aside class="bud" id="bud" aria-label="SetBud assistant"></aside>
</div>

<script>
const MARK = '<svg viewBox="0 0 24 24" width="62%" height="62%" fill="none" aria-hidden="true"><path d="M5 5.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-4 3.2v-3.2H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 15.6v-3.4" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/><path d="M12 12.7c-2.9 0-4.3-1.7-4.3-4 2.7 0 4.3 1.5 4.3 4z" fill="#fff"/><path d="M12 11.5c0-2.5 1.5-4 4.3-4 0 2.5-1.6 4-4.3 4z" fill="#fff"/></svg>';
const SCEN = [
  {id:"B",  label:"B · Campaign not delivered"},
  {id:"BE", label:"B · Edge: number limited by Meta"},
  {id:"A",  label:"A · Template rejected (user asks)"},
  {id:"D",  label:"D · Contact upload failed"},
  {id:"F",  label:"F · Agent hand-off view"}
];
const RATE_WA = 0.86, RATE_SMS = 0.20, WALLET = 4820;
let s = null; s = fresh("B");
function fresh(sc){ return {sc, step:0, lang:(s&&s.lang)||"en", fix:{resend:true,retry:true,remove:true,sms:false}, src:null, sent:false, from:"BE", path:null, typed:null}; }
const t = (en, hi) => s.lang === "hi" && hi ? hi : en;
const inr = n => "₹" + Math.round(n).toLocaleString("en-IN");
const $ = id => document.getElementById(id);

function go(sc, step){ if (sc !== s.sc){ const lang = s.lang; s = fresh(sc); s.lang = lang; } s.step = step; render(); }

/* ---------- shared pieces ---------- */
function side(active, agent){
  if (agent) return `<div class="ws">Support console<small>Agent: Priya</small></div><hr>
    ${["Queue","My tickets","Handed over by SetBud","Knowledge base"].map((n,i)=>`<div class="nav ${i===2?"on":""}">${n}</div>`).join("")}`;
  return `<div class="ws">Kesar &amp; Co.<small>Sample D2C brand · Growth plan</small></div><hr>
    ${["Dashboard","Campaigns","Contacts","Templates","Chatbots","Inbox","Wallet"].map(n=>`<div class="nav ${n===active?"on":""}">${n}</div>`).join("")}`;
}
function budShell(feed, opts={}){
  return `<div class="budhead"><div class="budmark" aria-hidden="true">${MARK}</div>
    <div class="who"><b class="wm">Set<span>Bud</span></b><span>${t("Setup and support help, reads your account","Setup aur support help, aapka account dekh kar")}</span></div>
    <div class="lang" role="group" aria-label="Language">
      <button data-act="lang" data-v="en" aria-pressed="${s.lang==="en"}">English</button>
      <button data-act="lang" data-v="hi" aria-pressed="${s.lang==="hi"}">Hinglish</button></div></div>
    <div class="feed" id="feed">${feed}</div>

    <div class="budfoot"><input id="ask" aria-label="Ask SetBud" placeholder="${t("Ask about campaigns, templates, contacts…","Campaign, template, contacts ke baare mein poochhein…")}"><button class="btn" data-act="ask">${t("Send","Bhejein")}</button></div>`;

const bot = h => `<div class="msg bot">${h}</div>`;
const user = h => `<div class="msg user">${h}</div>`;
function solvedAsk(){
  return `<div class="solved"><span>${t("Was this solved?","Kya problem solve hui?")}</span>
    <button class="btn primary" data-act="solved-yes">${t("Yes","Haan")}</button>
    <button class="btn" data-act="solved-no">${t("No, still stuck","Nahi, abhi bhi atka hoon")}</button></div>`;
}
function handoffCard(reason){
  return bot(`<p>${t("I've passed this to a support specialist.","Maine yeh case support specialist ko de diya hai.")}</p>
    <div class="handcard"><div class="row"><div class="avatar" aria-hidden="true">P</div><div><b>Priya, Support</b><br><span style="color:var(--muted);font-size:12px">${t("Usually replies in about 12 min today","Aaj aam taur par 12 min mein jawab")}</span></div></div>

}
function diagnosisB(){

    <div class="issue"><span class="n" style="color:var(--bad)">212</span><b>${t("These numbers don't use WhatsApp","Yeh numbers WhatsApp par nahi hain")}</b>

      <span class="why">${t("These people got many offers from businesses this week, so Meta paused more marketing to them. Trying again tomorrow usually works.","In logon ko is hafte bahut offers mile, isliye Meta ne aur marketing rok di. Kal dobara bhejna aksar kaam karta hai.")} <span class="mono">131049</span></span></div>
    <div class="issue"><span class="n" style="color:var(--bud)">40</span><b>${t("Missing the +91 country code","+91 country code missing hai")}</b>
      <span class="why">${t("Saved as 10 digits, so WhatsApp couldn't find them.","10 digit mein save hain, isliye WhatsApp unhe dhoondh nahi paya.")}</span></div>
    <div class="evid">${t("Based on Meta's delivery report for this campaign, 12 Oct","Is campaign ki Meta delivery report ke basis par, 12 Oct")}</div>
    <div class="chips"><button class="chip" data-act="b-why">${t("Why does Meta hold messages?","Meta messages kyun rokta hai?")}</button></div>`);
}
function whyB(){
  return user(t("Why does Meta hold messages?","Meta messages kyun rokta hai?")) + bot(`<p>${t("Meta limits how many marketing messages one person gets from all businesses combined, so people don't get spammed. It's not a penalty on your account, and your other messages (like order updates) are not affected.","Meta dekhta hai ki ek insaan ko saare businesses se kitne marketing messages mil rahe hain, taaki spam na ho. Yeh aapke account par penalty nahi hai, aur order updates jaise messages par asar nahi padta.")}</p>`);
}
function fixOptions(){
  const f = s.fix;
  const o = (k, title, sub) => `<label class="opt" for="fx-${k}"><input type="checkbox" id="fx-${k}" data-fix="${k}" ${f[k]?"checked":""}><span><b>${title}</b><small>${sub}</small></span></label>`;
  return bot(`<p>${t("Here's what I can do. Pick what you want:","Main yeh kar sakta hoon. Jo chahiye select karein:")}</p>
    ${o("resend", t("Add +91 to the 40 numbers and resend now","40 numbers mein +91 jodkar abhi dobara bhejein"), t("About ","Lagbhag ")+inr(40*RATE_WA))}
    ${o("retry", t("Retry the 88 held messages tomorrow at 11:00 AM","88 ruke messages kal 11:00 AM par dobara bhejein"), t("About ","Lagbhag ")+inr(88*RATE_WA)+t(" · late morning has the best chance",""))}
    ${o("remove", t("Move the 212 non-WhatsApp numbers to a separate list","212 non-WhatsApp numbers ko alag list mein daalein"), t("So future campaigns don't waste money on them","Taaki aage paisa barbaad na ho"))}
    ${o("sms", t("Send the Diwali offer to those 212 by SMS instead","Un 212 ko Diwali offer SMS se bhejein"), t("About ","Lagbhag ")+inr(212*RATE_SMS)+t(" · uses your SMS credits",""))}
    <button class="btn primary" data-act="b-review">${t("Review changes","Changes dekhein")}</button>`);
}
function previewB(){
  const f = s.fix, items = []; let cost = 0;
  if (f.resend){ items.push(t("Fix 40 numbers (+91) and resend the Diwali message","40 numbers theek karke Diwali message dobara bhejna")); cost += 40*RATE_WA; }
  if (f.retry){ items.push(t("Schedule 88 messages for tomorrow, 11:00 AM","88 messages kal 11:00 AM ke liye schedule")); cost += 88*RATE_WA; }
  if (f.remove) items.push(t("Create list “Not on WhatsApp” with 212 numbers","212 numbers ki “Not on WhatsApp” list banana"));
  if (f.sms){ items.push(t("Send 212 SMS with the same offer","Same offer ke 212 SMS bhejna")); cost += 212*RATE_SMS; }
  if (!items.length) return bot(`<p>${t("You haven't picked anything yet.","Aapne abhi kuch select nahi kiya.")}</p><button class="btn" data-act="b-back">${t("Go back","Wapas jaayein")}</button>`);
  return bot(`<p>${t("Nothing changes until you confirm:","Aapke confirm karne tak kuch nahi badlega:")}</p>
    <div class="preview"><b>${t("I will","Main yeh karunga")}</b><ul>${items.map(i=>`<li>${i}</li>`).join("")}</ul>
    <div class="cost num"><span>${t("Estimated charge from wallet","Wallet se anumanit kharcha")}</span><span>${inr(cost)}</span></div>
    <div style="font-size:12px;color:var(--muted)">${t("Wallet balance ","Wallet balance ")}${inr(WALLET)}</div></div>
    <div class="row"><button class="btn primary" data-act="b-apply">${t("Apply changes","Changes lagu karein")}</button><button class="btn" data-act="b-back">${t("Edit","Badlein")}</button></div>`);
}
function resultB(){
  const f = s.fix, lines = [];
  if (f.resend) lines.push(t("40 resent: <b>38 delivered</b> so far","40 dobara bheje: abhi tak <b>38 deliver</b> hue"));
  if (f.retry) lines.push(t("88 scheduled for tomorrow, 11:00 AM. I'll tell you here if any fail again.","88 kal 11:00 AM ke liye schedule. Fail hue toh main yahin bataunga."));
  if (f.remove) lines.push(t("212 numbers moved to “Not on WhatsApp”","212 numbers “Not on WhatsApp” list mein"));
  if (f.sms) lines.push(t("212 SMS sent","212 SMS bhej diye"));
  return bot(`<p><b>${t("Done.","Ho gaya.")}</b></p><ul style="margin:0;padding-left:18px">${lines.map(l=>`<li>${l}</li>`).join("")}</ul>`);
}
function renderB(){
  const st = s.step;
  const notes = [
    "Proactive start: SetBud spotted the failed delivery from Meta's report and raised it before the owner opened a ticket.",
    "Diagnosis from evidence: every cause comes from a Meta error code, explained in plain language. Try the Hinglish toggle.",
    "The user chooses the fix. Costs are shown before anything happens.",
    "Confirm before acting: a preview and the wallet charge. This is the 'never act without asking' rule.",
    "Fix applied and the campaign numbers updated. 'Was this solved?' feeds the resolution-rate and repeat-contact checks in the audit sheet.",
    "Resolved without a human. This counts as one avoided ticket in the North Star metric."
  ];
  let feed = "";
  if (st>=1) feed += diagnosisB();
  if (st>=1 && s.why) feed += whyB();
  if (st>=1) feed += user(t("Show me how to fix this","Kaise theek karein, dikhao"));
  if (st>=2) feed += fixOptions();
  if (st>=3) feed += previewB();
  if (st>=4) feed += user(t("Apply changes","Changes lagu karein")) + resultB() + (st===4?solvedAsk():"");
  if (st===5) feed += user(t("Yes","Haan")) + bot(`<p>${t("Great. Marked as solved. I'll keep an eye on tomorrow's retry.","Badhiya. Solved mark kar diya. Kal ke retry par nazar rakhunga.")}</p>`);
  if (st===6) feed += user(t("No, still stuck","Nahi, abhi bhi atka hoon")) + handoffCard(t("this campaign's delivery report, the fixes applied and this chat","is campaign ki delivery report, kiye gaye fixes aur yeh chat"));
  if (st===1) feed = feed.replace(user(t("Show me how to fix this","Kaise theek karein, dikhao")), "") + bot(`<button class="btn primary" data-act="b-fix">${t("Show me how to fix this","Kaise theek karein, dikhao")}</button>`);
  return {nav:"Dashboard", main:dashB(st<4), bud: st>=1 ? budShell(feed) : null,
    note: st===6 ? "Edge case: the user says it isn't solved, so SetBud hands over to a person with the full context." : notes[Math.min(st,5)],
    stepText:`Step ${Math.min(st,5)+1} of 6`};
}

    BE:{title:"Kesar & Co.: number limited by Meta", pri:["bad","High priority · campaign stopped"], quality:"bad",
      one:"Diwali campaign stopped at 600 of 1,600 because Meta lowered the number's quality rating to Low.",
      checked:["Quality rating: Medium → Low on 12 Oct","47 blocks and reports this week, 39 within 24 h of the Diwali message","Template diwali_offer_20 is approved; not the cause"],
      notDone:["Did not promise when the limit will lift","Did not pause or change any campaign"],
      next:"Pause other marketing for 7 days, review the Diwali audience (39 blocks came from contacts added on 9 Oct), and file a quality review with Meta if needed.",
      reply:"Hi Ritu, Priya here. I've looked at your number: Meta lowered its quality after 47 people blocked or reported the Diwali message. I'd suggest pausing marketing for a week while we review who received it. Can we do a 10-minute call today?"},
    B:{title:"Diwali campaign: still not delivering after fixes", pri:["warn","Normal priority"], quality:"ok",
      one:"SetBud fixed 40 numbers and scheduled 88 retries, but the customer says the campaign still isn't working.",
      checked:["Meta report: 212 not on WhatsApp (131026), 88 held for marketing limits (131049), 40 missing +91","Customer approved: resend 40, retry 88 tomorrow 11:00 AM, move 212 to a separate list","38 of 40 resends delivered"],
      notDone:["Did not send SMS (customer didn't choose it)","Did not change the template"],
      next:"Ask what still looks wrong: the 2 undelivered resends, the scheduled retry, or something else in the campaign.",
      reply:"Hi Ritu, Priya here. I can see SetBud fixed 40 numbers (38 delivered) and scheduled 88 for tomorrow. What still looks wrong to you? If it's the 2 resends that didn't arrive, I'll check those numbers now."},
    A:{title:"Template resubmitted: customer still stuck", pri:["warn","Normal priority"], quality:"ok",
      one:"SetBud fixed and resubmitted “bhai_dooj_flash” (Utility → Marketing, ending fixed), but the customer says it's still not solved.",
      checked:["Meta rejection: INCORRECT_CATEGORY, and a variable as the last word","Customer approved the rewrite and Marketing category","Resubmitted 13 Oct, status In review"],
      notDone:["Did not change the offer wording beyond the ending","Did not promise approval"],
      next:"Ask whether the concern is the review wait, the higher Marketing cost, or the wording.",
      reply:"Hi Ritu, Priya here. Your Bhai Dooj template is back with Meta for review. What's still worrying you: the wait, the Marketing price, or the wording? Happy to help with any of them."},
    AB:{title:"Refund request: ₹412 on 12 Oct", pri:["warn","Billing · normal priority"], quality:"ok",
      one:"Customer wants a refund for ₹412 charged on 12 Oct after SetBud explained the breakdown.",
      checked:["₹389 = 452 delivered marketing messages × ₹0.86","₹23 = 180 utility messages × ₹0.13","Charges match send logs; no duplicate charge found"],
      notDone:["Did not promise or issue a refund","Did not change any charge"],
      next:"Ask which send the customer thinks shouldn't be billed. Undelivered messages were not charged.",
      reply:"Hi Ritu, Priya from billing here. The ₹412 covers 452 delivered Diwali messages and 180 order updates; undelivered messages weren't charged. Is there a specific send you think shouldn't have been billed? I'll check it right away."},
    D:{title:"Contact import: customer still stuck", pri:["warn","Normal priority"], quality:"ok",
      one:"Imported 2,362 contacts after SetBud's fixes but says it's still not working.",
      checked:["Fixed 214 numbers (+91), removed 18 duplicates","Set aside 20 nine-digit numbers","Asked about consent and recorded the customer's answer"],
      notDone:["Did not guess the 20 incomplete numbers"],
      next:"Ask which part isn't working: the list, a campaign, or the 20 set-aside rows.",
      reply:"Hi Ritu, Priya here. I can see your 2,362 contacts are imported. Which part isn't working for you: the list itself, sending a campaign, or the 20 numbers we set aside?"}
  };
  const v = V[s.from] || V.BE;
  const q = v.quality==="bad" ? '<span class="pill bad">Low</span>' : '<span class="pill ok">High</span>';
  const main = `<div class="crumb">Handed over by SetBud › Ticket #48213</div>
    <div class="row" style="justify-content:space-between"><h1 class="h1">${v.title}</h1><span class="pill ${v.pri[0]}">${v.pri[1]}</span></div>
    <div class="console">
      <div class="card sum">
        <section><h3>Customer's problem in one line</h3><div>${v.one}</div></section>
        <section><h3>What SetBud checked</h3><ul>${v.checked.map(x=>`<li>${x}</li>`).join("")}</ul></section>
        <section><h3>What SetBud did not do</h3><ul>${v.notDone.map(x=>`<li>${x}</li>`).join("")}</ul></section>
        <section><h3>Suggested next step</h3><div>${v.next}</div></section>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
        <div class="card"><b>Account at a glance</b><dl class="kv" style="margin-top:8px">
          <dt>Plan</dt><dd>Growth</dd><dt>Number quality</dt><dd>${q}</dd>
          <dt>Messaging tier</dt><dd>1K per day</dd><dt>Wallet</dt><dd class="num">${inr(WALLET)}</dd><dt>Customer since</dt><dd>Aug 2026 (2 months)</dd><dt>Earlier tickets</dt><dd>1 (template rejected, solved by SetBud)</dd></dl></div>
        <div class="card"><b>Reply to Ritu</b>
          ${s.sent?`<div class="sentok" style="margin-top:8px">Reply sent. Ritu sees it in the SetBud panel and by email.</div>`:`<label for="reply" class="crumb" style="display:block;margin:6px 0">Draft from SetBud, edit before sending</label>
          <textarea id="reply">${v.reply}</textarea>
          <div class="row" style="margin-top:8px"><button class="btn primary" data-act="f-send">Send reply</button><button class="btn" data-act="noop">View full chat</button></div>`}
        </div>
      </div></div>`;
  return {nav:null, agent:true, main, bud:null,
    note: s.sent ? "The agent replied in their first message, with no 'please share a screenshot' back-and-forth. This is why handled tickets take about 25% less time in the cost model."
      : "Agent view: everything SetBud learned arrives as a summary, the account state, what it did and didn't do, and a draft reply. Each scenario's hand-off opens its own version of this screen.",
    stepText: s.sent ? "Step 2 of 2" : "Step 1 of 2"};
}

/* ---------- A: template rejected, user-initiated ---------- */
function tplTable(){
  const st = s.step, done = s.path==="tpl" && st>=2;
  const rows = [
    ["diwali_offer_20","Marketing",'<span class="pill ok">Approved</span>',"10 Oct"],
    ["order_shipped","Utility",'<span class="pill ok">Approved</span>',"2 Sep"],
    ["bhai_dooj_flash", done?"Marketing":"Utility", done?'<span class="pill warn">In review</span>':'<span class="pill bad">Rejected</span>', done?"Just now":"13 Oct"]];
  return `<div class="crumb">Templates</div><h1 class="h1">Message templates</h1>
    <div class="card"><div class="tablewrap"><table><thead><tr><th>Name</th><th>Category</th><th>Status</th><th>Updated</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td class="mono">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td class="num">${r[3]}</td></tr>`).join("")}</tbody></table></div></div>
    ${done?"":`<div class="crumb">bhai_dooj_flash was rejected by Meta. Ritu doesn't know why, so she opens SetBud and asks.</div>`}`;
}
function walletPage(){
  return `<div class="crumb">Wallet</div><h1 class="h1">Wallet</h1>
    <div class="stats"><div class="stat"><div class="k">Balance</div><div class="v num">${inr(WALLET)}</div></div><div class="stat"><div class="k">Spent yesterday</div><div class="v num">₹412</div></div></div>
    <div class="card"><b>Yesterday, 12 Oct</b><div class="tablewrap"><table class="num"><thead><tr><th>Item</th><th>Messages</th><th>Rate</th><th>Amount</th></tr></thead><tbody>
    <tr><td>Diwali Offer 2026 (marketing, delivered only)</td><td>452</td><td>₹0.86</td><td>₹389</td></tr>
    <tr><td>Order shipped updates (utility)</td><td>180</td><td>₹0.13</td><td>₹23</td></tr>
    <tr><td><b>Total</b></td><td></td><td></td><td><b>₹412</b></td></tr></tbody></table></div></div>`;
}
function bubble(text){ return `<div style="background:#DCF8C6;color:#111;border-radius:8px 8px 8px 2px;padding:8px 10px;font-size:13px;max-width:100%">${text}</div>`; }
function renderA(){
  const st = s.step;
  const chips = `<div class="chips">
      <button class="chip" data-act="a-ask" data-v="tpl">${t("My template got rejected","Mera template reject ho gaya")}</button>
      <button class="chip" data-act="a-ask" data-v="bill">${t("Why was I charged ₹412 yesterday?","Kal ₹412 kyun kate?")}</button>
      <button class="chip" data-act="a-ask" data-v="other">${t("How do I send to more people per day?","Roz zyada logon ko kaise bhejun?")}</button></div>`;
  let feed = bot(`<p>${t("Hi Ritu. What do you need help with? You can type in your own words.","Namaste Ritu. Kis cheez mein madad chahiye? Apne shabdon mein likh sakti hain.")}</p>${(st===0 && !s.path)?chips:""}`);
  if (s.typed) feed += user(s.typed);
  if (s.path==="other") feed += bot(`<p>${t("Your daily limit (1,000 people) goes up automatically as you send to more people with good quality. That flow isn't part of this demo, so try one of these:","Aapki daily limit (1,000 log) achhi quality ke saath zyada bhejne par apne aap badhti hai. Yeh demo ka hissa nahi hai, inme se ek try karein:")}</p>${chips}`);
  if (s.path==="tpl"){
    if (!s.typed) feed += user(t("My template got rejected","Mera template reject ho gaya"));
    feed += bot(`<p><b>${t("Meta rejected “bhai_dooj_flash” on 13 Oct for 2 reasons:","Meta ne 13 Oct ko “bhai_dooj_flash” 2 wajah se reject kiya:")}</b></p>
      <div class="issue"><span class="n" style="color:var(--bad)">1</span><b>${t("Wrong category","Galat category")}</b><span class="why">${t("It was sent as Utility, but it's a discount offer. Offers must be Marketing.","Ise Utility mein bheja, par yeh discount offer hai. Offers Marketing mein jaate hain.")} <span class="mono">INCORRECT_CATEGORY</span></span></div>
      <div class="issue"><span class="n" style="color:var(--bad)">2</span><b>${t("Message ends with a blank","Message ek blank par khatam hota hai")}</b><span class="why">${t("Meta doesn't allow a {{variable}} as the very last word.","Meta aakhri shabd ke roop mein {{variable}} allow nahi karta.")}</span></div>
      <div class="evid">${t("From Meta's rejection notice for this template","Is template ke Meta rejection notice se")}</div>
      <p style="font-size:13px"><b>${t("Before","Pehle")}</b></p>${bubble('Hi {{1}}, Bhai Dooj special! Flat 20% off on all gift hampers till Sunday. Use code {{2}}')}
      <p style="font-size:13px"><b>${t("After (my suggestion)","Baad mein (mera sujhav)")}</b></p>${bubble('Hi {{1}}, Bhai Dooj special! Flat 20% off on all gift hampers till Sunday. Use code {{2}} at checkout. Reply STOP to opt out.')}
      <div class="preview" style="font-size:13px">${t("Category: <b>Marketing</b>. Marketing messages cost about ₹0.86 each instead of ₹0.13, so this changes your campaign cost.","Category: <b>Marketing</b>. Marketing message lagbhag ₹0.86 ka padta hai, ₹0.13 nahi, isliye campaign ka kharcha badlega.")}</div>
      ${st===1?`<div class="row"><button class="btn primary" data-act="a-submit">${t("Submit to Meta","Meta ko submit karein")}</button><button class="btn" data-act="noop">${t("Edit text","Text badlein")}</button></div>`:""}`);
    if (st>=2) feed += user(t("Submit to Meta","Meta ko submit karein")) + bot(`<p><b>${t("Submitted.","Submit ho gaya.")}</b> ${t("Status: In review. Meta usually decides within a few hours. I'll tell you here when it's approved, and nothing is sent to customers until you start a campaign.","Status: In review. Meta aam taur par kuch ghanton mein faisla karta hai. Approve hone par main yahin bataunga; campaign shuru karne tak customers ko kuch nahi jaayega.")}</p>`) + (st===2?solvedAsk():"");
    if (st===3) feed += user(t("Yes","Haan")) + bot(`<p>${t("Great. Marked as solved.","Badhiya. Solved mark kar diya.")}</p>`);
    if (st===4) feed += user(t("No, still stuck","Nahi, abhi bhi atka hoon")) + handoffCard(t("Meta's rejection notice, the rewrite and this chat","Meta ka rejection notice, rewrite aur yeh chat"));
  }
  if (s.path==="bill"){
    if (!s.typed) feed += user(t("Why was I charged ₹412 yesterday?","Kal ₹412 kyun kate?"));
    feed += bot(`<p><b>${t("Here's the ₹412 from 12 Oct:","12 Oct ke ₹412 ka hisaab:")}</b></p>
      <div class="issue"><span class="n">₹389</span><b>${t("Diwali Offer: 452 marketing messages","Diwali Offer: 452 marketing messages")}</b><span class="why">${t("₹0.86 each, charged only for delivered messages","₹0.86 har ek, sirf deliver hue messages ka")}</span></div>
      <div class="issue"><span class="n">₹23</span><b>${t("Order shipped: 180 utility messages","Order shipped: 180 utility messages")}</b><span class="why">${t("₹0.13 each","₹0.13 har ek")}</span></div>
      <div class="evid">${t("From your wallet history, 12 Oct","Aapki wallet history se, 12 Oct")}</div>
      <p>${t("This matches your sends. If you think a charge is wrong or you want a refund, our billing team handles that. I can't change charges.","Yeh aapke bheje gaye messages se match karta hai. Agar charge galat lagta hai ya refund chahiye, toh billing team dekhti hai. Main charges badal nahi sakta.")}</p>
      ${st===10?`<div class="row"><button class="btn" data-act="a-billok">${t("Makes sense, thanks","Samajh gaya, dhanyavaad")}</button><button class="btn primary" data-act="a-billhand">${t("I want a refund","Mujhe refund chahiye")}</button></div>`:""}`);
    if (st===11) feed += user(t("I want a refund","Mujhe refund chahiye")) + handoffCard(t("the ₹412 breakdown, wallet history for 12 Oct and this chat","₹412 ka breakdown, 12 Oct ki wallet history aur yeh chat"));
    if (st===12) feed += user(t("Makes sense, thanks","Samajh gaya, dhanyavaad")) + bot(`<p>${t("Glad that helped. Marked as solved.","Achha laga madad karke. Solved mark kar diya.")}</p>`);
  }
  const notes = {0:"User-initiated: Ritu opens SetBud herself. Pick a suggested question, or type your own (try “template rejected” or “why was I charged”).",
    1:"Diagnosis from Meta's rejection notice in plain words, with a before/after rewrite and the cost impact of the category change. Submitting is the confirm step.",
    2:"Resubmitted with a clear status and what happens next. No ticket raised for the highest-volume query type.",
    3:"Resolved without a human.", 4:"Not solved, so SetBud hands over with context.",
    10:"Edge case: money. SetBud explains the charge from wallet history but cannot change it, per the 'won't handle money' rule.",
    11:"Refund request goes to a human with the breakdown attached.", 12:"Billing question answered without a human."};
  const main = s.path==="bill" ? walletPage() : tplTable();
  const stepText = s.path==="bill" ? `Billing edge case · step ${st===10?1:2} of 2` : `Step ${Math.min(st,3)+1} of 4`;
  return {nav: s.path==="bill"?"Wallet":"Templates", main, bud: budShell(feed), note: notes[st] || notes[0], stepText};
}

/* ---------- render ---------- */
function render(){
  const r = {A:renderA, B:renderB, BE:renderBE, D:renderD, F:renderF}[s.sc]();
  $("tabs").innerHTML = SCEN.map(x=>`<button class="tab" data-act="scen" data-v="${x.id}" aria-pressed="${x.id===s.sc}">${x.label}</button>`).join("");
  $("note").innerHTML = `<b>What this shows</b><span>${r.note}</span><span class="step">${r.stepText}</span>`;
  $("side").innerHTML = side(r.nav, r.agent);
  $("main").innerHTML = r.main;
  const bud = $("bud");
  if (r.bud){ bud.hidden = false; bud.innerHTML = r.bud; $("app").classList.remove("nobud"); const f = $("feed"); if (f) f.scrollTop = f.scrollHeight;
    if (matchMedia("(max-width: 1100px)").matches && render.last !== s.sc+s.step) bud.scrollIntoView({block:"start"}); }
  else { bud.hidden = true; bud.innerHTML = ""; $("app").classList.add("nobud"); }
  render.last = s.sc+s.step;
}

document.addEventListener("change", e => {
  const k = e.target.dataset && e.target.dataset.fix;
  if (k){ s.fix[k] = e.target.checked; }
});
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  switch(a){
    case "scen": { const lang = s.lang; s = fresh(v); s.lang = lang; render(); break; }
    case "restart": { const lang = s.lang; s = fresh(s.sc); s.lang = lang; render(); break; }
    case "lang": s.lang = v; render(); break;
    case "b-open": go("B",1); break;
    case "b-why": s.why = true; render(); break;
    case "b-fix": go("B",2); break;
    case "b-review": go("B",3); break;
    case "b-back": go("B",2); break;
    case "b-apply": go("B",4); break;
    case "be-open": go("BE",1); break;
    case "be-hand": go("BE",2); break;
    case "d-open": go("D",1); break;
    case "d-fix": go("D",2); break;
    case "d-src": s.src = v; go("D",3); break;
    case "d-import": go("D",4); break;
    case "solved-yes": s.step = s.sc==="A" ? 3 : 5; render(); break;
    case "solved-no": s.step = s.sc==="A" ? 4 : 6; render(); break;
    case "handoff":
      if (s.sc==="B"){ s.step = 6; render(); }
      else if (s.sc==="D"){ s.step = 6; render(); }
      else if (s.sc==="A"){ if (s.path==="bill") s.step = 11; else if (s.path==="tpl") s.step = 4; render(); }
      break;
    case "a-ask": aAsk(v); break;
    case "ask": { const i = $("ask"); if (i) freeAsk(i.value); break; }
    case "a-submit": s.step = 2; render(); break;
    case "a-billok": s.step = 12; render(); break;
    case "a-billhand": s.step = 11; render(); break;
    case "to-agent": { const from = s.sc==="A" && s.path==="bill" ? "AB" : s.sc; const lang = s.lang; s = fresh("F"); s.lang = lang; s.from = from; render(); break; }
    case "f-send": s.sent = true; render(); break;
  }
});
function aAsk(path, typed){
  if (s.sc !== "A"){ const lang = s.lang; s = fresh("A"); s.lang = lang; }
  s.path = path; s.typed = typed || null;
  s.step = path==="tpl" ? 1 : path==="bill" ? 10 : 0;
  render();
}
function freeAsk(text){
  const q = (text||"").trim(); if (!q) return;
  const low = q.toLowerCase();
  const path = /templat|reject/.test(low) ? "tpl" : /charg|bill|paisa|kate|refund|wallet|₹/.test(low) ? "bill" : "other";
  const lang = s.lang; s = fresh("A"); s.lang = lang;
  aAsk(path, q);
}
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "ask") freeAsk(e.target.value); });
render();
</script>
</body>
</html>
